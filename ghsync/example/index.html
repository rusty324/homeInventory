<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ghsync example — notes</title>
<link rel="stylesheet" href="../ghsync.css">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; color: #111827; }
  main { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  h1 { font-size: 1.2rem; margin: 0; flex: 1; }
  #toasts { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; }
  .toast { display: inline-block; background: #111827; color: #fff; padding: 8px 14px; border-radius: 8px; margin-top: 6px; }
  .toast.error { background: #b91c1c; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Notes</h1>
    <span id="badge" class="gh-badge"></span>
    <button class="btn secondary" id="settings-btn">⚙ Settings</button>
  </header>
  <div class="field-row">
    <input id="new-note" placeholder="Write a note…">
    <button class="btn" id="add-note">Add</button>
  </div>
  <div id="notes"></div>
  <div id="settings" class="gh-settings" hidden></div>
</main>
<div id="toasts"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
