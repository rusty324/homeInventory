<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Home Records</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<!-- Add to Home Screen: iOS uses the apple-touch-icon (180×180, opaque);
     Android/Chrome use the manifest. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Home Records">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c211f" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="app-head">
  <div class="brand">
    <img class="brand-icon" src="icons/icon.svg" width="26" height="26" alt="">
    <span>Home Records</span>
  </div>
  <button id="badge" class="gh-badge" type="button" title="Sync status"></button>
  <a href="#settings" data-tab="settings" class="tab-settings" aria-label="Settings">⚙<span class="tab-text"> Settings</span></a>
  <nav class="tabs" aria-label="Tools">
    <a href="#paint" data-tab="paint">Paint</a>
    <a href="#breakers" data-tab="breakers">Breakers</a>
    <a href="#inventory" data-tab="inventory">Inventory</a>
    <a href="#maintenance" data-tab="maintenance">Maintenance <span id="overdue-count" class="tab-count" hidden></span></a>
  </nav>
</header>
<main id="view"></main>
<div id="toasts" aria-live="polite"></div>
<div id="print-root"></div>
<noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
